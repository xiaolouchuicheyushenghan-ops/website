<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>真言 · A学院纪事</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-hua: #e8704a;
      --color-leian: #52b788;
      --color-narrator: #c9b99a;
      --color-inner: #ffd166;
      --dialog-bg: rgba(4, 4, 12, 0.84);
      --choice-bg: rgba(6, 6, 18, 0.90);
      --font: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', '宋体', serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #08070f;
      font-family: var(--font);
    }

    /* ═══ GAME CONTAINER ═══ */
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ═══ BACKGROUND LAYERS ═══ */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.9s ease;
    }
    #bg-a { z-index: 1; }
    #bg-b { z-index: 2; opacity: 0; }

    /* subtle vignette overlay */
    #vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    /* ═══ FLOATING PARTICLES ═══ */
    #particles {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float-up linear infinite;
      opacity: 0;
    }
    @keyframes float-up {
      0%   { transform: translateY(110vh) translateX(0);              opacity: 0; }
      8%   { opacity: 0.9; }
      85%  { opacity: 0.3; }
      100% { transform: translateY(-30px) translateX(var(--drift));   opacity: 0; }
    }

    /* ═══ SCENE LABEL ═══ */
    #scene-label {
      position: absolute;
      top: clamp(14px, 2.5vh, 24px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      color: rgba(255,255,255,0.28);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }

    /* ═══ CHARACTER AREA ═══ */
    #character-wrap {
      position: absolute;
      bottom: calc(30% + 10px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    #char-badge {
      width: clamp(70px, 12vw, 110px);
      height: clamp(70px, 12vw, 110px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 700;
      border: 2px solid currentColor;
      opacity: 0.82;
      transition: color 0.5s ease, box-shadow 0.5s ease;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }

    /* ═══ DIALOG BOX ═══ */
    #dialog-area {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      padding: 0 clamp(16px,5vw,80px) clamp(18px,3.5vh,36px);
    }
    #dialog-box {
      background: var(--dialog-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: clamp(16px,2.5vh,26px) clamp(20px,3vw,36px);
      cursor: pointer;
      user-select: none;
      position: relative;
      min-height: clamp(110px,20vh,150px);
    }
    #char-name-box {
      font-size: clamp(0.78rem,1.4vw,0.96rem);
      font-weight: 600;
      letter-spacing: 0.18em;
      margin-bottom: 10px;
      padding-left: 2px;
      transition: color 0.35s ease;
    }
    #dialog-text {
      font-size: clamp(0.9rem,1.7vw,1.1rem);
      line-height: 1.9;
      color: #e2dbd2;
      min-height: 3.4em;
      word-break: break-all;
    }
    #continue-hint {
      position: absolute;
      bottom: 13px; right: 18px;
      color: rgba(255,255,255,0.35);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      display: none;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 0.35; }
      50%      { opacity: 0.9; }
    }

    /* ═══ CHOICES ═══ */
    #choices-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 30;
      padding: 0 clamp(16px,5vw,80px) clamp(18px,3.5vh,36px);
      display: none;
    }
    .choices-wrap {
      background: var(--choice-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 8px 8px 10px;
    }
    .choice-hint-text {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.28);
      text-align: center;
      letter-spacing: 0.25em;
      padding: 7px 0 4px;
    }
    .choice-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 7px;
      color: #ccc6be;
      font-family: var(--font);
      font-size: clamp(0.88rem,1.55vw,1.02rem);
      padding: clamp(11px,1.7vh,16px) clamp(14px,2.5vw,22px);
      margin-top: 5px;
      cursor: pointer;
      text-align: left;
      line-height: 1.55;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .choice-btn:hover, .choice-btn:focus {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.28);
      color: #fff;
      outline: none;
    }
    .choice-prefix {
      color: rgba(255,255,255,0.3);
      margin-right: 8px;
      font-size: 0.75em;
      vertical-align: middle;
    }

    /* ═══ TITLE SCREEN ═══ */
    #title-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: linear-gradient(160deg, #08050f 0%, #110820 50%, #080510 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease;
    }
    #title-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .title-eyebrow {
      color: rgba(255,255,255,0.18);
      font-size: clamp(0.6rem,1.1vw,0.78rem);
      letter-spacing: 0.55em;
      margin-bottom: 22px;
    }
    .title-zh {
      font-size: clamp(3.5rem,8vw,6rem);
      font-weight: 700;
      color: #f0e8df;
      letter-spacing: 0.3em;
      text-shadow: 0 0 80px rgba(220,140,80,0.25);
      margin-bottom: 6px;
      line-height: 1;
    }
    .title-sub-zh {
      font-size: clamp(0.78rem,1.3vw,1rem);
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.45em;
      margin-bottom: 56px;
    }
    .title-rule {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.28), transparent);
      margin-bottom: 36px;
    }
    #start-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.72);
      font-family: var(--font);
      font-size: clamp(0.8rem,1.3vw,0.95rem);
      letter-spacing: 0.45em;
      padding: 13px 50px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #start-btn:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.45);
      color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }
    .title-version {
      margin-top: 20px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.2em;
    }

    /* ═══ CARD GALLERY BUTTON ═══ */
    #card-gallery-btn {
      position: absolute;
      bottom: clamp(14px,2.5vh,24px);
      right: clamp(16px,3vw,30px);
      z-index: 50;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.4);
      font-family: var(--font);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      padding: 7px 14px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #card-gallery-btn:hover {
      color: rgba(255,255,255,0.8);
      border-color: rgba(255,255,255,0.35);
    }

    /* ═══ CARD GALLERY OVERLAY ═══ */
    #card-overlay {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: rgba(4,3,10,0.95);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      padding: clamp(20px,4vh,50px) clamp(20px,4vw,60px);
      overflow-y: auto;
    }
    #card-overlay.open { display: flex; }
    .gallery-title {
      font-size: clamp(1rem,2vw,1.4rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.3em;
      margin-bottom: 30px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 700px;
    }
    .card-item {
      aspect-ratio: 3/4;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255,255,255,0.02);
      position: relative;
      overflow: hidden;
    }
    .card-item::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card-item:hover::before { opacity: 1; }
    .card-item:hover {
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-3px);
    }
    .card-badge {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      background: rgba(0,0,0,0.4);
    }
    .card-name {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.7);
      text-align: center;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }
    .card-attr {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.15em;
    }
    .card-locked {
      filter: blur(2px) grayscale(0.8);
      opacity: 0.4;
    }
    .card-locked::after {
      content: '🔒';
      position: absolute;
      font-size: 1.5rem;
      filter: none;
    }
    #gallery-close {
      margin-top: 30px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.5);
      font-family: var(--font);
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      padding: 9px 28px;
      border-radius: 2px;
      cursor: pointer;
    }
    #gallery-close:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

    /* ═══ FLASH OVERLAY ═══ */
    #flash-overlay {
      position: absolute;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center,
        rgba(255,220,150,0.18) 0%,
        rgba(200,160,80,0.08) 40%,
        transparent 70%);
    }
    @keyframes flash-in {
      0%   { opacity: 0; }
      18%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .flash-active { animation: flash-in 1.1s ease forwards; }

    /* ═══ DIALOG SLIDE IN ═══ */
    @keyframes dialog-slide {
      from { transform: translateY(18px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    .dialog-enter { animation: dialog-slide 0.32s ease forwards; }

    /* ═══ CHOICE STAGGER ═══ */
    @keyframes choice-in {
      from { transform: translateX(-16px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    /* ═══ TITLE PULSE ═══ */
    .title-zh {
      animation: title-pulse 4s ease-in-out infinite alternate;
    }
    @keyframes title-pulse {
      from { text-shadow: 0 0 40px rgba(232,112,74,0.2), 0 0 80px rgba(180,80,30,0.1); }
      to   { text-shadow: 0 0 60px rgba(232,112,74,0.45), 0 0 120px rgba(180,80,30,0.2); }
    }

    /* ═══ MUSIC BUTTON ═══ */
    #music-btn {
      position: absolute;
      top: clamp(12px,2vh,20px);
      right: clamp(14px,2.5vw,26px);
      z-index: 50;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.35);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.25s ease;
    }
    #music-btn:hover { color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.3); }
    #music-btn.muted { color: rgba(255,255,255,0.18); }

    /* ═══ MOBILE ═══ */
    @media (max-width: 600px) {
      #character-wrap { bottom: calc(28% + 8px); }
    }
    @media (max-height: 550px) {
      #character-wrap { display: none; }
    }
  </style>
</head>
<body>
<div id="game">

  <!-- Backgrounds -->
  <div id="bg-a" class="bg-layer"></div>
  <div id="bg-b" class="bg-layer"></div>
  <div id="vignette"></div>

  <!-- Particles -->
  <div id="particles"></div>

  <!-- Scene flash -->
  <div id="flash-overlay"></div>

  <!-- Music toggle -->
  <button id="music-btn">♪ 音 乐</button>

  <!-- Scene label -->
  <div id="scene-label"></div>

  <!-- Character badge -->
  <div id="character-wrap">
    <div id="char-badge"></div>
  </div>

  <!-- Dialog -->
  <div id="dialog-area">
    <div id="dialog-box">
      <div id="char-name-box"></div>
      <div id="dialog-text"></div>
      <div id="continue-hint">点击继续 ▶</div>
    </div>
  </div>

  <!-- Choices -->
  <div id="choices-panel">
    <div class="choices-wrap">
      <div class="choice-hint-text">— 做 出 选 择 —</div>
      <div id="choices-list"></div>
    </div>
  </div>

  <!-- Card gallery button -->
  <button id="card-gallery-btn">图 鉴</button>

  <!-- Card gallery overlay -->
  <div id="card-overlay">
    <div class="gallery-title">· 人 物 图 鉴 ·</div>
    <div class="card-grid" id="card-grid"></div>
    <button id="gallery-close">关 闭</button>
  </div>

  <!-- Title screen -->
  <div id="title-screen">
    <div class="title-eyebrow">A C A D E M Y · C H R O N I C L E S</div>
    <div class="title-zh">真　言</div>
    <div class="title-sub-zh">A 学 院 纪 事</div>
    <div class="title-rule"></div>
    <button id="start-btn">开 始 故 事</button>
    <div class="title-version">序章 · 入学之日</div>
  </div>

</div>

<script>
// ════════════════════════════════════════════
//  GAME DATA
// ════════════════════════════════════════════
const CHARS = {
  narrator: { name: '旁白',           color: '#c9b99a', initial: '·',  glow: 'rgba(201,185,154,0.3)' },
  inner:    { name: '〔内心〕',        color: '#ffd166', initial: '心',  glow: 'rgba(255,209,102,0.3)' },
  hua:      { name: '华·洛佩兹',      color: '#e8704a', initial: '华',  glow: 'rgba(232,112,74,0.35)' },
  leian:    { name: '莱安·斯图尔特',  color: '#52b788', initial: '莱',  glow: 'rgba(82,183,136,0.35)' },
  eve:      { name: '伊芙·洛佩兹',    color: '#f4a261', initial: '伊',  glow: 'rgba(244,162,97,0.35)' },
};

const BG = {
  night_gate:   'linear-gradient(180deg, #080614 0%, #0f0c1e 45%, #19122a 100%)',
  hall_day:     'linear-gradient(180deg, #090d1a 0%, #111828 50%, #1a2035 100%)',
  corridor:     'linear-gradient(180deg, #07080f 0%, #0d0f1c 60%, #141626 100%)',
  outside_dusk: 'linear-gradient(160deg, #100808 0%, #1f0e0a 40%, #2b1510 100%)',
  fire_glow:    'linear-gradient(180deg, #0e0400 0%, #200800 50%, #2e0e04 100%)',
  forest_deep:  'linear-gradient(180deg, #030f06 0%, #081508 50%, #0d1e10 100%)',
  academy_dawn: 'linear-gradient(180deg, #060810 0%, #0e1020 50%, #181525 100%)',
  end_screen:   'linear-gradient(160deg, #08050f 0%, #100815 100%)',
};

const CARDS = [
  { id: 'hua',    name: '华·洛佩兹',     attr: '火属性 · 法师',     initial: '华', color: '#e8704a', bg: BG.fire_glow,    locked: false },
  { id: 'leian',  name: '莱安·斯图尔特', attr: '木属性 · 法师',     initial: '莱', color: '#52b788', bg: BG.forest_deep,  locked: true  },
  { id: 'angela', name: 'Angela',         attr: 'DLC · 天使 · 序',      initial: '✦', color: '#b8cce0', bg: BG.academy_dawn, locked: false, dlc: 'angela.html' },
  { id: 'dlc2',   name: '殊荣·混沌中',    attr: 'DLC · 混沌 · 十字架', initial: '†',  color: '#c8a060', bg: BG.fire_glow,    locked: false, dlc: 'dlc2.html'   },
];

const SCENES = {

  // ─── 序章 ───
  prologue_01: {
    bg: BG.night_gate, label: '2019年 · 深秋 · A学院',
    char: 'narrator', initial: false,
    text: '2019年，深秋。\n\nA学院矗立于城市北郊的丘陵之上，有百年历史。入学通知书上，校徽的压纹微微泛着暗金色的光。',
    next: 'prologue_02',
  },

  prologue_02: {
    bg: BG.night_gate, label: '2019年 · 深秋 · A学院',
    char: 'narrator', initial: false,
    text: '每一届新生，都将在这里继承自己家族的义务与能力——\n\n这是学院存在的意义，也是传承数代的契约。',
    next: 'prologue_03',
  },

  prologue_03: {
    bg: BG.night_gate, label: '2019年 · 深秋 · A学院正门',
    char: 'hua', initial: true,
    text: '……到了。',
    next: 'prologue_04',
  },

  prologue_04: {
    bg: BG.night_gate, label: '2019年 · 深秋 · A学院正门',
    char: 'inner',
    text: '（大门比他想象中的更高。铁制的门柱上刻着他一点都不陌生的家徽——洛佩兹家的火焰纹。）\n\n（还在的。完好无损，熔铸在铁里，像它从来都理所当然地属于这里。）\n\n（而他，以养子的身份，站在它下面。）',
    next: 'prologue_05',
  },

  prologue_05: {
    bg: BG.night_gate, label: '2019年 · 深秋 · A学院正门',
    char: 'hua',
    text: '……没关系。\n\n总有一天，我会把它刻回来的。',
    next: 'gate_01',
  },

  // ─── 正门 → 入学登记 ───
  gate_01: {
    bg: BG.hall_day, label: 'A学院 · 主楼大厅',
    char: 'narrator', initial: false,
    text: '大厅里已经聚集了许多新生。西装革履的，锦衣华服的，也有像他这样穿着朴素的——\n\n但大多数人都低着头，各自心事重重。',
    next: 'gate_eve',
  },

  gate_eve: {
    bg: BG.hall_day, label: 'A学院 · 主楼大厅',
    char: 'narrator', initial: false,
    text: '人群里有一个人和其他所有人都不一样——\n\n她推着行李箱，挥着手和每一个路过的人打招呼，仿佛来的不是魔法学院，是什么野餐活动。锤形的法器随意挂在包侧，晃啊晃的。',
    next: 'gate_eve_02',
  },

  gate_eve_02: {
    bg: BG.hall_day, label: 'A学院 · 主楼大厅',
    char: 'inner',
    text: '（华·洛佩兹认识她。）\n\n（他没有走过去。）',
    next: 'gate_choice',
  },

  gate_choice: {

//  AUDIO SYSTEM
// ════════════════════════════════════════════
let audioCtx = null;
let masterGain = null;
let musicMuted = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.16, audioCtx.currentTime + 4);
  masterGain.connect(audioCtx.destination);

  // ── 低频主音 (A1 55Hz) ──
  const bass = audioCtx.createOscillator();
  bass.type = 'sine';
  bass.frequency.value = 55;
  const bassGain = audioCtx.createGain();
  bassGain.gain.value = 0.55;
  bass.connect(bassGain);
  bassGain.connect(masterGain);
  bass.start();

  // ── 五度和声 (E2 82Hz) ──
  const fifth = audioCtx.createOscillator();
  fifth.type = 'sine';
  fifth.frequency.value = 82.4;
  const fifthGain = audioCtx.createGain();
  fifthGain.gain.value = 0.28;
  fifth.connect(fifthGain);
  fifthGain.connect(masterGain);
  fifth.start();

  // ── 高音气氛垫 (A3 220Hz triangle) ──
  const pad = audioCtx.createOscillator();
  pad.type = 'triangle';
  pad.frequency.value = 220;
  const padGain = audioCtx.createGain();
  padGain.gain.value = 0.09;

  // 缓慢颤音 LFO
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.12;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.04;
  lfo.connect(lfoGain);
  lfoGain.connect(padGain.gain);

  pad.connect(padGain);
  padGain.connect(masterGain);
  pad.start();
  lfo.start();

  // ── 延迟回声增加空间感 ──
  const delay = audioCtx.createDelay(2);
  delay.delayTime.value = 0.75;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.35;
  const delayOut = audioCtx.createGain();
  delayOut.gain.value = 0.08;
  padGain.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(delayOut);
  delayOut.connect(masterGain);

  // ── 神秘高泛音 (B4 493Hz) ──
  const shimmer = audioCtx.createOscillator();
  shimmer.type = 'sine';
  shimmer.frequency.value = 493.9;
  const shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = 0;
  const shimmerLFO = audioCtx.createOscillator();
  shimmerLFO.type = 'sine';
  shimmerLFO.frequency.value = 0.07;
  const shimmerLFOGain = audioCtx.createGain();
  shimmerLFOGain.gain.value = 0.025;
  shimmerLFO.connect(shimmerLFOGain);
  shimmerLFOGain.connect(shimmerGain.gain);
  shimmer.connect(shimmerGain);
  shimmerGain.connect(masterGain);
  shimmer.start();
  shimmerLFO.start();
  setTimeout(() => {
    if (shimmerGain) shimmerGain.gain.linearRampToValueAtTime(0.025, audioCtx.currentTime + 6);
  }, 5000);
}

let _lastClick = 0;
function playClick() {
  if (!audioCtx || musicMuted) return;
  const now = audioCtx.currentTime;
  if (now - _lastClick < 0.108) return;
  _lastClick = now;

  function noiseBuf(ms, decay) {
    const len = Math.floor(audioCtx.sampleRate * ms / 1000);
    const b = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    return b;
  }

  // 层1：触发点"涩感" — 带通噪声 1300Hz，模拟轴体摩擦的粗糙感
  const s1 = audioCtx.createBufferSource();
  s1.buffer = noiseBuf(12, 0.5);
  const f1 = audioCtx.createBiquadFilter();
  f1.type = 'bandpass'; f1.frequency.value = 1300; f1.Q.value = 4;
  const g1 = audioCtx.createGain(); g1.gain.value = 0.05;
  s1.connect(f1); f1.connect(g1); g1.connect(audioCtx.destination);
  s1.start(now);

  // 层2：键帽落板"嗒" — 低通噪声 380Hz，4ms后触发
  const s2 = audioCtx.createBufferSource();
  s2.buffer = noiseBuf(16, 4);
  const f2 = audioCtx.createBiquadFilter();
  f2.type = 'lowpass'; f2.frequency.value = 200;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.025;
  s2.connect(f2); f2.connect(g2); g2.connect(audioCtx.destination);
  s2.start(now + 0.004);
}

function toggleMusic() {
  if (!audioCtx) { initAudio(); return; }
  musicMuted = !musicMuted;
  const t = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(t);
  masterGain.gain.linearRampToValueAtTime(musicMuted ? 0 : 0.16, t + 1);
  el.musicBtn.textContent = musicMuted ? '♪ 静 音' : '♪ 音 乐';
  el.musicBtn.classList.toggle('muted', musicMuted);
}

// ── Background ──
function setBg(bgDef) {
  if (bgDef === state.currentBg) return;
  state.currentBg = bgDef;

  const incoming = state.bgActive === 'a' ? el.bgB : el.bgA;
  const outgoing  = state.bgActive === 'a' ? el.bgA : el.bgB;

  const val = bgDef.startsWith('url(') ? bgDef : bgDef;
  incoming.style.background = val;
  incoming.style.backgroundSize = 'cover';
  incoming.style.backgroundPosition = 'center';
  incoming.style.opacity = '1';
  outgoing.style.opacity  = '0';

  state.bgActive = state.bgActive === 'a' ? 'b' : 'a';
}

function setCharacter(charKey) {
  const char = CHARS[charKey];

    el.charWrap.style.opacity = '0';

  el.charWrap.style.opacity = '1';

}

function initParticles() {
  el.particles.innerHTML = '';
  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 2.5 + 1;

      box-shadow: 0 0 4px ${state.particleColor};
    `;
    el.particles.appendChild(p);
  }
}

function updateParticles(charKey) {
  const colors = { hua: '#ff8855', leian: '#55cc88', narrator: '#aa9977', inner: '#ffcc55' };
  const newColor = colors[charKey] || '#aa9977';
  if (newColor === state.particleColor) return;
  state.particleColor = newColor;
  initParticles();
}

// ── Typewriter ──
function typewrite(text, el, onDone) {
  el.textContent = '';
  state.typing = true;
  el.parentElement.querySelector('#continue-hint').style.display = 'none';

  // Handle newlines
  const lines = text.split('\n');
  let fullHtml = lines.join('<br>');
  const plainChars = text.replace(/\n/g, ' ').split('');
  let i = 0;

  function tick() {
    if (i >= plainChars.length) {
      el.innerHTML = fullHtml;
      state.typing = false;
      if (onDone) onDone();
      return;
    }
    // Rebuild up to char i in the plain text, respecting newlines
    let built = '';
    let plainIdx = 0;
    for (const line of lines) {
      for (const ch of line) {
        if (plainIdx <= i) built += ch;
        plainIdx++;
      }
      if (plainIdx <= i + 1) built += '<br>';
    }
    el.innerHTML = built;
    i++;
    playClick();
    state.typingTimer = setTimeout(tick, 38);
  }
  tick();
}

function skipTypewriter(fullText) {
  clearTimeout(state.typingTimer);
  const lines = fullText.split('\n');
  el.dialogText.innerHTML = lines.join('<br>');
  state.typing = false;
}

// ── Load scene ──
function loadScene(sceneId) {
  if (sceneId === 'THE_END') { showEnd(); return; }

  const scene = SCENES[sceneId];
  if (!scene) { console.warn('Missing scene:', sceneId); return; }

  const prevBg = state.currentBg;
  state.sceneId = sceneId;

  // Background + flash on change
  if (scene.bg !== prevBg) triggerFlash();
  setBg(scene.bg);

  // Label
  el.sceneLabel.textContent = scene.label || '';

  // Character
  setCharacter(scene.char);

  // Character name
  const char = CHARS[scene.char];
  el.charName.textContent = char ? char.name : '';
  el.charName.style.color = char ? char.color : '#ccc';

  // Hide choices, show dialog with entrance animation
  el.choices.style.display  = 'none';
  el.dialogBox.style.display = 'block';
  el.hint.style.display = 'none';
  el.dialogBox.classList.remove('dialog-enter');
  void el.dialogBox.offsetWidth;
  el.dialogBox.classList.add('dialog-enter');

  // Typewriter
  typewrite(scene.text, el.dialogText, () => {
    if (scene.choices) {
      showChoices(scene.choices);
    } else {
      el.hint.style.display = 'block';
    }
  });
}

function showChoices(choices) {
  el.choiceList.innerHTML = '';
  choices.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.style.opacity = '0';
    btn.innerHTML = `<span class="choice-prefix">${['①','②','③','④'][idx]}</span>${c.text}`;
    btn.addEventListener('click', () => {
      el.choices.style.display = 'none';
      loadScene(c.next);
    });
    el.choiceList.appendChild(btn);
    // Stagger in each button
    setTimeout(() => {
      btn.style.animation = `choice-in 0.3s ease ${idx * 90}ms forwards`;
    }, 10);
  });
  el.choices.style.display = 'block';
  el.hint.style.display = 'none';
}

function showEnd() {
  el.choices.style.display = 'none';
  el.hint.style.display = 'none';
  el.charName.textContent = '';
  el.dialogText.innerHTML = '';
  setBg(BG.end_screen);
  setCharacter('narrator');

  el.charWrap.style.opacity = '0';
  el.sceneLabel.textContent = '';

  setTimeout(() => {
    el.dialogText.innerHTML = '序章终。<br><br><span style="color:rgba(255,255,255,0.35);font-size:0.85em;letter-spacing:0.15em">— 后续剧情正在书写中 —</span>';
    el.hint.style.display = 'none';
  }, 400);
}

// ── Click handler ──
el.dialogBox.addEventListener('click', () => {
  const scene = SCENES[state.sceneId];
  if (!scene) return;

  if (state.typing) {
    skipTypewriter(scene.text);
    state.typing = false;
    if (scene.choices) {
      showChoices(scene.choices);
    } else {
      el.hint.style.display = 'block';
    }
    return;
  }

  if (!scene.choices && !state.typing) {
    if (scene.next) loadScene(scene.next);
  }
});

// ── Card gallery ──
function buildCardGrid() {
  el.cardGrid.innerHTML = '';
  CARDS.forEach(card => {
    const item = document.createElement('div');
    item.className = 'card-item' + (card.locked ? ' card-locked' : '');
    item.style.background = card.locked
      ? 'rgba(255,255,255,0.02)'
      : `${card.bg}, rgba(0,0,0,0.4)`;
    item.style.backgroundBlendMode = 'overlay';

    item.innerHTML = `
      <div class="card-badge" style="color:${card.color}">${card.initial}</div>
      <div class="card-name">${card.name}</div>
      <div class="card-attr">${card.attr}</div>
      ${card.dlc ? '<div class="card-attr" style="color:rgba(255,255,255,0.3);margin-top:4px">点击进入 ▶</div>' : ''}
    `;
    item.style.setProperty('--card-color', card.color);
    if (card.dlc && !card.locked) {
      item.addEventListener('click', () => openDLC(card.dlc));
      item.style.cursor = 'pointer';
    }
    el.cardGrid.appendChild(item);
  });
}

el.cardBtn.addEventListener('click', () => {
  buildCardGrid();
  el.cardOverlay.classList.add('open');
});

// ── DLC navigation (works on htmlpreview + local) ──
function openDLC(dlcFile) {
  const href = window.location.href;
  // htmlpreview 实际渲染时 location 是 raw.githubusercontent.com
  if (href.includes('raw.githubusercontent.com')) {
    const dlcRaw = href.replace(/\/[^/?#]+\.html.*$/, '/' + dlcFile);
    window.location.href = 'https://htmlpreview.github.io/?' + encodeURIComponent(dlcRaw);
    return;
  }
  // 直接在 htmlpreview 域名下
  if (href.includes('htmlpreview.github.io')) {
    const rawUrl = decodeURIComponent(href.split('?')[1] || '');
    if (rawUrl) {
      const dlcRaw = rawUrl.replace(/\/[^/?#]+\.html.*$/, '/' + dlcFile);
      window.location.href = 'https://htmlpreview.github.io/?' + encodeURIComponent(dlcRaw);
      return;
    }
  }
  window.location.href = dlcFile;
}

// ── Music toggle ──
el.musicBtn.addEventListener('click', () => {
  if (!audioCtx) { initAudio(); return; }
  toggleMusic();
});

initParticles();
setBg(BG.night_gate);

// 粒子颜色加入伊芙
const _origUpdateParticles = updateParticles;
function updateParticles(charKey) {
  const colors = { hua: '#ff8855', leian: '#55cc88', eve: '#f4a261', narrator: '#aa9977', inner: '#ffcc55' };
  const newColor = colors[charKey] || '#aa9977';
  if (newColor === state.particleColor) return;
  state.particleColor = newColor;
  initParticles();
}
